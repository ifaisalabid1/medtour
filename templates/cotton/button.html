{% load ui %}
<c-vars href="" variant="primary" size="md" class="" type="button" />
{% button_classes variant size as classes %}
{% if href %}
  <a href="{{ href }}" class="{{ classes }} {{ class }}" {{ attrs }}>{{ slot }}</a>
{% else %}
  <button type="{{ type }}" class="{{ classes }} {{ class }}" {{ attrs }}>{{ slot }}</button>
{% endif %}
