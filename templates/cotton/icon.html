{% comment %}
  An icon from the sprite in static/img/icons.svg (one cached file for every icon).
  Decorative by default: pass label="..." when the icon is the only content of
  a link or button.
  Usage: <c-icon name="phone" class="size-4" />
{% endcomment %}
{% load static %}
<c-vars name="" class="size-5" label="" />
<svg class="{{ class }}" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"
     {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %} {{ attrs }}>
  <use href="{% static 'img/icons.svg' %}#{{ name }}"></use>
</svg>
