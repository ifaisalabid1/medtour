{% comment %}
  Section heading with an optional eyebrow label, intro text (the slot) and
  "see all" link.
  Usage: <c-section-heading eyebrow="Specialities" title="Find care by speciality" />
{% endcomment %}
<c-vars eyebrow="" title="" link_href="" link_text="" />
<div class="mb-10 flex flex-wrap items-end justify-between gap-4">
  <div class="max-w-2xl">
    {% if eyebrow %}<p class="mb-2 text-xs font-bold uppercase tracking-widest text-brand-700">{{ eyebrow }}</p>{% endif %}
    <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 md:text-4xl">{{ title }}</h2>
    {% if slot %}<div class="mt-3 text-slate-600">{{ slot }}</div>{% endif %}
  </div>
  {% if link_href %}
    <a href="{{ link_href }}"
       class="inline-flex items-center gap-1 font-semibold text-brand-700 hover:underline">
      {{ link_text }}
      <c-icon name="arrow-right" class="size-4" />
    </a>
  {% endif %}
</div>
