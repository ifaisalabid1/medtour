{% extends "base.html" %}
{% block title %}{{ article.title }}{% endblock %}
{% block content %}
  <article>
    <h1>{{ article.title }}</h1>
    <p>
      By {{ article.author.name }}.
      Medically reviewed by {{ article.medical_reviewer.name }}
      on {{ article.reviewed_on|date:"j F Y" }}.
    </p>
    {{ article.body|safe }}
  </article>
{% endblock %}
