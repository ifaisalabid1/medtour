[project]
name = "medtour"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django-anymail[amazon-ses]>=15.2",
    "django-axes>=8.3.1",
    "django-cotton>=2.7.2",
    "django-countries>=9.1.0",
    "django-environ>=0.14.0",
    "django-health-check>=4.8.0",
    "django-phonenumber-field[phonenumbers]>=8.5.0",
    "django-prose-editor[sanitize]>=0.27.3",
    "django-simple-history>=3.13.0",
    "django-storages[s3]>=1.14.6",
    "django-tailwind-cli>=4.8.1",
    "django-tasks-db>=0.13.0",
    "django-unfold>=0.108.0",
    "django[argon2]>=6.1.1",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "requests>=2.34.2",
    "sentry-sdk[django]>=2.71.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "djlint>=1.46.4",
    "model-bakery>=1.24.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # Django-specific checks
    "S",   # bandit security checks
    "SIM", # simplifications
    "C4",  # comprehensions
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF012", # false positives on Django Meta/ModelAdmin class attributes
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"] # star imports between settings files
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and dummy passwords in tests

[tool.pytest]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# Only "test_..." functions and "...Tests" classes are tests, so names such as
# testimonials_for_treatment() and Testimonial are never collected by mistake.
python_functions = ["test_*"]
python_classes = ["*Tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--reuse-db"]
filterwarnings = [
    # Fail the tests if our own code uses a deprecated Django API.
    'error::DeprecationWarning:apps\.',
    'error::PendingDeprecationWarning:apps\.',
    # Unfold 0.108 overrides get_action_choices() with the pre-Django 6.1
    # signature. Remove this line once an Unfold release fixes it.
    'ignore:Overriding get_action_choices:PendingDeprecationWarning:unfold\.admin',
]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
# django-cotton components (<c-button>, <c-icon>, ...) are formatted as HTML tags.
custom_html = "c-[\\w.-]+"
preserve_blank_lines = true
max_blank_lines = 1
# H026 "empty class attribute" misfires on cotton defaults such as <c-vars class="" />.
ignore = "H026"
